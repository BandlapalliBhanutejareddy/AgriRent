name: agrirent

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${DOCKER_REGISTRY_USER:-teja3}/agrirent-backend:${AGRORENT_VERSION:-latest}
    container_name: agrorent-backend
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PORT: 4000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-agrorent-production-jwt-secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen:0.5b}
    networks:
      - agrirent_network
    ports:
      - "4000:4000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    image: ${DOCKER_REGISTRY_USER:-teja3}/agrirent-web:${AGRORENT_VERSION:-latest}
    container_name: agrorent-web
    restart: always
    env_file:
      - path: ./web/.env
        required: false
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    networks:
      - agrirent_network
    ports:
      - "${WEB_PORT:-3001}:3000"
    depends_on:
      - backend

networks:
  agrirent_network:
    name: agrirent_network
    driver: bridge
