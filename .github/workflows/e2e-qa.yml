name: End-to-End QA

on:
  workflow_dispatch:

jobs:
  web-selenium-e2e:
    name: Web Selenium E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: agrorent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install Root Dependencies
      run: npm install

    - name: Setup & Migrate Backend Database
      run: |
        cd backend
        npm install
        npx prisma db push --skip-generate
        npm run seed
        npm run build
      env:
        DATABASE_URL: "postgresql://postgres:password123@localhost:5432/agrorent_test"
        DIRECT_URL: "postgresql://postgres:password123@localhost:5432/agrorent_test"
        JWT_SECRET: "test_jwt_secret_for_ci_environment_32chars_long"

    - name: Start Backend Service
      run: |
        cd backend
        nohup npm start > /tmp/backend.log 2>&1 &
      env:
        PORT: 4000
        DATABASE_URL: "postgresql://postgres:password123@localhost:5432/agrorent_test"
        DIRECT_URL: "postgresql://postgres:password123@localhost:5432/agrorent_test"
        JWT_SECRET: "test_jwt_secret_for_ci_environment_32chars_long"
        SUPABASE_URL: "https://placeholder.supabase.co"
        SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder"

    - name: Build Web Application
      run: |
        cd web
        npm install
        npm run build
      env:
        NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder"
        NEXT_PUBLIC_API_URL: "http://localhost:4000/api"

    - name: Start Web Application
      run: |
        cd web
        nohup npm start > /tmp/web.log 2>&1 &
      env:
        PORT: 3000
        NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder"
        NEXT_PUBLIC_API_URL: "http://localhost:4000/api"

    - name: Wait for Services Readiness
      run: |
        echo "Waiting for Backend (http://localhost:4000/api/health)..."
        READY_BE=false
        for i in {1..30}; do
          if curl -s http://localhost:4000/api/health | grep -q "status"; then
            echo "Backend is ready and healthy!"
            READY_BE=true
            break
          fi
          sleep 1
        done
        if [ "$READY_BE" != "true" ]; then
          echo "Backend failed to start. Logs:"
          cat /tmp/backend.log
          exit 1
        fi

        echo "Waiting for Web (http://localhost:3000)..."
        READY_WEB=false
        for i in {1..30}; do
          if curl -s -I http://localhost:3000 | grep -q "200\|308\|307"; then
            echo "Web is ready!"
            READY_WEB=true
            break
          fi
          sleep 1
        done
        if [ "$READY_WEB" != "true" ]; then
          echo "Web failed to start. Logs:"
          cat /tmp/web.log
          exit 1
        fi

    - name: Run Web Selenium Tests
      run: npm run test:web
      env:
        WEB_BASE_URL: "http://localhost:3000"
        API_BASE_URL: "http://localhost:4000"

    - name: Publish Web QA Summary to GitHub Actions Summary
      if: always()
      run: |
        if [ -f reports/qa/web/summary.md ]; then
          cat reports/qa/web/summary.md >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload Web QA Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: web-selenium-qa-reports
        path: reports/qa/web/
        if-no-files-found: warn

  android-appium-e2e:
    name: Android Appium E2E Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install Root Dependencies
      run: npm install

    - name: Install Appium & UiAutomator2 Driver
      run: |
        npm install -g appium
        appium driver install uiautomator2

    - name: Build Android Debug APK
      run: |
        cd mobile
        flutter pub get
        flutter build apk --debug

    - name: Enable KVM group permissions
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Start Appium Server
      run: |
        mkdir -p reports/qa/mobile
        appium --log reports/qa/mobile/appium_server.log &
        sleep 5

    - name: Run Android Emulator & Appium Tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 31
        target: google_apis
        arch: x86_64
        profile: pixel_6
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
        script: npm run test:mobile

    - name: Publish Mobile QA Summary to GitHub Actions Summary
      if: always()
      run: |
        if [ -f reports/qa/mobile/summary.md ]; then
          cat reports/qa/mobile/summary.md >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload Mobile QA Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: android-appium-qa-reports
        path: reports/qa/mobile/
        if-no-files-found: warn
