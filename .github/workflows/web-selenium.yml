name: Web Selenium QA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  web-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: agrorent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install Root Dependencies
      run: npm install

    - name: Setup & Migrate Backend Database
      run: |
        cd backend
        npm install
        npx prisma db push --skip-generate
        npm run build
      env:
        DATABASE_URL: "postgresql://postgres:password123@localhost:5432/agrorent_test"
        DIRECT_URL: "postgresql://postgres:password123@localhost:5432/agrorent_test"
        JWT_SECRET: "test_jwt_secret_for_ci_environment_32chars_long"

    - name: Start Backend Service
      run: |
        cd backend
        npm start &
      env:
        PORT: 4000
        DATABASE_URL: "postgresql://postgres:password123@localhost:5432/agrorent_test"
        DIRECT_URL: "postgresql://postgres:password123@localhost:5432/agrorent_test"
        JWT_SECRET: "test_jwt_secret_for_ci_environment_32chars_long"

    - name: Build Web Application
      run: |
        cd web
        npm install
        npm run build
      env:
        NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder"
        NEXT_PUBLIC_API_URL: "http://localhost:4000/api"

    - name: Start Web Application
      run: |
        cd web
        npm start &
      env:
        PORT: 3000
        NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder"
        NEXT_PUBLIC_API_URL: "http://localhost:4000/api"

    - name: Wait for Services Readiness
      run: |
        echo "Waiting for Backend (http://localhost:4000/api/health)..."
        for i in {1..30}; do
          if curl -s http://localhost:4000/api/health; then
            echo "Backend is ready!"
            break
          fi
          sleep 1
        done

        echo "Waiting for Web (http://localhost:3000)..."
        for i in {1..30}; do
          if curl -s -I http://localhost:3000 | grep -q "200\|308\|307"; then
            echo "Web is ready!"
            break
          fi
          sleep 1
        done

    - name: Run Web Selenium Tests
      run: npm run test:web
      env:
        WEB_BASE_URL: "http://localhost:3000"
        API_BASE_URL: "http://localhost:4000"

    - name: Upload Web QA Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: web-selenium-qa-reports
        path: reports/qa/web/
        if-no-files-found: warn
