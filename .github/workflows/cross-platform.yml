name: Cross Platform QA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  cross-platform-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: agrorent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install Root Dependencies
      run: npm install

    - name: Backend Build & Database Migration
      run: |
        cd backend
        npm install
        npx prisma db push --skip-generate
        npm run build
      env:
        DATABASE_URL: "postgresql://postgres:password123@localhost:5432/agrorent_test"
        DIRECT_URL: "postgresql://postgres:password123@localhost:5432/agrorent_test"
        JWT_SECRET: "test_jwt_secret_for_ci_environment_32chars_long"

    - name: Start Backend Service
      run: |
        cd backend
        npm start &
      env:
        PORT: 4000
        DATABASE_URL: "postgresql://postgres:password123@localhost:5432/agrorent_test"
        DIRECT_URL: "postgresql://postgres:password123@localhost:5432/agrorent_test"
        JWT_SECRET: "test_jwt_secret_for_ci_environment_32chars_long"

    - name: Web Build & Type Check
      run: |
        cd web
        npm install
        npm run build
      env:
        NEXT_PUBLIC_API_URL: "http://localhost:4000"

    - name: Flutter Dependencies & Unit/Widget Tests
      run: |
        cd mobile
        flutter pub get
        flutter test --no-pub

    - name: Run Cross-Platform Parity Suite
      run: npm run test:cross
      env:
        API_BASE_URL: "http://localhost:4000"

    - name: Upload Cross-Platform QA Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cross-platform-qa-reports
        path: reports/qa/cross-platform/
        if-no-files-found: warn
