name: Android Appium QA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  android-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install Root Dependencies
      run: npm install

    - name: Install Appium & UiAutomator2 Driver
      run: |
        npm install -g appium
        appium driver install uiautomator2

    - name: Build Android Debug APK
      run: |
        cd mobile
        flutter pub get
        flutter build apk --debug

    - name: Enable KVM group permissions
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Start Appium Server
      run: |
        mkdir -p reports/qa/mobile
        appium --log reports/qa/mobile/appium_server.log &
        sleep 5

    - name: Run Android Emulator & Appium Tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 31
        target: google_apis
        arch: x86_64
        profile: pixel_6
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
        script: npm run test:mobile

    - name: Upload Mobile QA Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: android-appium-qa-reports
        path: reports/qa/mobile/
        if-no-files-found: warn
