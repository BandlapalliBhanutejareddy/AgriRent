config:
  target: "{{ $env.API_BASE_URL || 'http://localhost:4000' }}"
  phases:
    - duration: 10
      arrivalRate: 10
      name: Warm up phase
    - duration: 40
      arrivalRate: 100
      name: Sustained 100 VU baseline load
    - duration: 10
      arrivalRate: 20
      name: Cool down phase
  plugins:
    expect: {}
  defaults:
    headers:
      Content-Type: "application/json"

scenarios:
  - name: "AgroRent Marketplace & Liveness User Flow"
    flow:
      - get:
          url: "/api/health"
          expect:
            - statusCode: 200
      - think: 1
      - get:
          url: "/api/equipment"
          expect:
            - statusCode: 200
      - think: 1
      - get:
          url: "/api/equipment/categories"
          expect:
            - statusCode: 200
